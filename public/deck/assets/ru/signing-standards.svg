<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 440"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10" fill="#6366f1" /></marker></defs><g font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" fill="#f3f4f6"><text x="600" y="35" text-anchor="middle" font-size="25" fill="#f3f4f6" font-weight="400">NIP: общие спецификации для совместимых приложений</text><rect x="20" y="90" width="360" height="205" rx="14" fill="#6366f1" fill-opacity=".07" stroke="#6366f1" stroke-opacity=".3" stroke-width="2" /><text x="200" y="135" text-anchor="middle" font-size="30" fill="#6366f1" font-weight="700">NIP-01</text><text x="200" y="190" text-anchor="middle" font-size="20.66" fill="#f3f4f6" font-weight="700">События + ретрансляторы</text><text x="200" y="240" text-anchor="middle" font-size="18.02" fill="#f3f4f6" font-weight="400">Как публиковать и запрашивать</text><rect x="420" y="90" width="360" height="205" rx="14" fill="#6366f1" fill-opacity=".07" stroke="#6366f1" stroke-opacity=".3" stroke-width="2" /><text x="600" y="135" text-anchor="middle" font-size="30" fill="#6366f1" font-weight="700">NIP-07</text><text x="600" y="190" text-anchor="middle" font-size="27" fill="#f3f4f6" font-weight="700">Подпись в браузере</text><text x="600" y="240" text-anchor="middle" font-size="19" fill="#f3f4f6" font-weight="400">Сайт запрашивает подпись у расширения</text><rect x="820" y="90" width="360" height="205" rx="14" fill="#6366f1" fill-opacity=".07" stroke="#6366f1" stroke-opacity=".3" stroke-width="2" /><text x="1000" y="135" text-anchor="middle" font-size="30" fill="#6366f1" font-weight="700">NIP-46</text><text x="1000" y="190" text-anchor="middle" font-size="20.96" fill="#f3f4f6" font-weight="700">Удалённая подпись</text><text x="1000" y="240" text-anchor="middle" font-size="19" fill="#f3f4f6" font-weight="400">Приложение запрашивает удалённую подпись</text><text x="600" y="355" text-anchor="middle" font-size="27" fill="#f3f4f6" font-weight="700">Приложение готовит · инструмент проверяет и подписывает</text><text x="600" y="405" text-anchor="middle" font-size="21.43" fill="#f3f4f6" font-weight="400">Общий интерфейс позволяет выбирать совместимые приложения и инструменты.</text></g></svg>