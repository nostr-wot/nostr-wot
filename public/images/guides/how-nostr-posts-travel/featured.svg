<svg width="1600" height="900" viewBox="0 0 1600 900" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">A signed Nostr event moving from one client through three relays to two reader clients</title>
  <desc id="desc">An indigo event capsule travels along orbit lines from a composing client to three relay servers and then to two receiving clients.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#EEF2FF"/><stop offset="1" stop-color="#DDD6FE"/></linearGradient>
    <linearGradient id="enamel" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#818CF8"/><stop offset="1" stop-color="#4F46E5"/></linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#312E81" flood-opacity=".22"/></filter>
  </defs>
  <rect width="1600" height="900" rx="56" fill="url(#bg)"/>
  <g fill="none" stroke="#6366F1" stroke-width="8" stroke-linecap="round" opacity=".42">
    <path d="M330 450 C500 230 620 250 775 335"/><path d="M330 450 C510 450 615 450 775 450"/><path d="M330 450 C500 670 620 650 775 565"/>
    <path d="M825 335 C990 250 1110 260 1270 390"/><path d="M825 450 C1010 450 1110 450 1270 510"/><path d="M825 565 C990 650 1110 620 1270 510"/>
  </g>
