    <circle cx="280" cy="410" r="42" fill="#A7F3D0"/><path d="M230 500h100" stroke="#4F46E5" stroke-width="18" stroke-linecap="round"/><path d="M252 540h56" stroke="#A5B4FC" stroke-width="14" stroke-linecap="round"/>
    <g fill="url(#enamel)"><rect x="710" y="260" width="180" height="150" rx="38"/><rect x="710" y="375" width="180" height="150" rx="38"/><rect x="710" y="490" width="180" height="150" rx="38"/></g>
    <g fill="#EEF2FF"><rect x="755" y="302" width="90" height="16" rx="8"/><rect x="755" y="337" width="62" height="14" rx="7"/><rect x="755" y="417" width="90" height="16" rx="8"/><rect x="755" y="452" width="62" height="14" rx="7"/><rect x="755" y="532" width="90" height="16" rx="8"/><rect x="755" y="567" width="62" height="14" rx="7"/></g>
    <rect x="1210" y="250" width="260" height="220" rx="48" fill="#FFFFFF" stroke="#C7D2FE" stroke-width="8"/><rect x="1210" y="460" width="260" height="220" rx="48" fill="#FFFFFF" stroke="#C7D2FE" stroke-width="8"/>
    <circle cx="1340" cy="325" r="36" fill="#FDBA74"/><circle cx="1340" cy="535" r="36" fill="#A7F3D0"/><path d="M1285 405h110M1285 615h110" stroke="#4F46E5" stroke-width="16" stroke-linecap="round"/>
  </g>
  <g transform="translate(520 392) rotate(-7)" filter="url(#shadow)"><rect width="220" height="116" rx="58" fill="#FFFFFF" stroke="#6366F1" stroke-width="8"/><circle cx="62" cy="58" r="22" fill="#22C55E"/><path d="M105 44h68M105 72h46" stroke="#6366F1" stroke-width="14" stroke-linecap="round"/></g>
  <g fill="#F97316"><circle cx="500" cy="285" r="12"/><circle cx="1010" cy="300" r="12"/><circle cx="1110" cy="610" r="10"/></g>
