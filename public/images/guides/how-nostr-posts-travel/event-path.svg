<svg width="1200" height="520" viewBox="0 0 1200 520" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">The publication path for a Nostr event</title>
  <desc id="desc">One client sends a signed event to three independent relays. Two reader clients query different subsets of those relays.</desc>
