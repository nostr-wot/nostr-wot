  <g fill="#EEF2FF"><rect x="560" y="145" width="80" height="12" rx="6"/><rect x="560" y="175" width="54" height="10" rx="5"/><rect x="560" y="235" width="80" height="12" rx="6"/><rect x="560" y="265" width="54" height="10" rx="5"/><rect x="560" y="325" width="80" height="12" rx="6"/><rect x="560" y="355" width="54" height="10" rx="5"/></g>
  <rect x="920" y="125" width="210" height="150" rx="32" fill="#FFF" stroke="#C7D2FE" stroke-width="6"/><rect x="920" y="275" width="210" height="150" rx="32" fill="#FFF" stroke="#C7D2FE" stroke-width="6"/><circle cx="1025" cy="180" r="26" fill="#FDBA74"/><circle cx="1025" cy="330" r="26" fill="#A7F3D0"/><path d="M980 235h90M980 385h90" stroke="#4F46E5" stroke-width="12" stroke-linecap="round"/>
