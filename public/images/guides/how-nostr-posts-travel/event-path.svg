  <rect width="1200" height="520" rx="32" fill="url(#bg)"/>
  <g fill="none" stroke="#818CF8" stroke-width="6" stroke-linecap="round"><path d="M250 260C360 120 450 120 540 170"/><path d="M250 260H540"/><path d="M250 260C360 400 450 400 540 350"/><path d="M660 170C770 120 860 150 950 220"/><path d="M660 260C770 260 860 260 950 300"/><path d="M660 350C770 400 860 360 950 300"/></g>
