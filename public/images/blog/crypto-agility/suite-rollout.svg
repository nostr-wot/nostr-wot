<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="655" viewBox="0 0 1200 655" role="img" aria-labelledby="title desc"><title id="title">Adding a suite without replacing the relay</title><desc id="desc">Specify and review a suite, implement independent readers, authenticate capability advertisement, choose a shared permitted suite, and send through an eligible inbox relay.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#596579"/></marker></defs><rect width="1200" height="655" fill="#f5f7fb"/>
<text x="48" y="48" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#18233c">Adding a suite without replacing the relay</text>
<text x="48" y="84" font-family="Arial,sans-serif" font-size="17" fill="#475569">Suite B is a symbolic future suite, not an allocated algorithm or shipped API.</text>
<rect x="48" y="130" width="330" height="170" rx="14" fill="white" stroke="#cbd5e1"/><rect x="48" y="130" width="6" height="170" rx="3" fill="#4f46e5"/>
<text x="70" y="164" font-family="Arial,sans-serif" font-size="19" fill="#4f46e5">1. Specify + review</text>
<text x="70" y="200" font-family="Arial,sans-serif" font-size="17" fill="#475569">Algorithms, keys and framing</text>
<text x="70" y="227" font-family="Arial,sans-serif" font-size="17" fill="#475569">Bind selector + party context</text>
<text x="70" y="254" font-family="Arial,sans-serif" font-size="17" fill="#475569">Assign immutable local pair</text>
<rect x="435" y="130" width="330" height="170" rx="14" fill="white" stroke="#cbd5e1"/><rect x="435" y="130" width="6" height="170" rx="3" fill="#4f46e5"/>
<text x="457" y="164" font-family="Arial,sans-serif" font-size="19" fill="#4f46e5">2. Implement readers</text>
<text x="457" y="200" font-family="Arial,sans-serif" font-size="17" fill="#475569">Independent test vectors</text>
<text x="457" y="227" font-family="Arial,sans-serif" font-size="17" fill="#475569">Signer + recipient support</text>
<text x="457" y="254" font-family="Arial,sans-serif" font-size="17" fill="#475569">Key backup and recovery</text>
<rect x="822" y="130" width="330" height="170" rx="14" fill="white" stroke="#cbd5e1"/><rect x="822" y="130" width="6" height="170" rx="3" fill="#4f46e5"/>
<text x="844" y="164" font-family="Arial,sans-serif" font-size="19" fill="#4f46e5">3. Advertise support</text>
<text x="844" y="200" font-family="Arial,sans-serif" font-size="17" fill="#475569">Authenticated suite/key binding</text>
<text x="844" y="227" font-family="Arial,sans-serif" font-size="17" fill="#475569">Freshness and rotation policy</text>
<text x="844" y="254" font-family="Arial,sans-serif" font-size="17" fill="#475569">Preserve minimum security</text>
<path d="M381 216 L429 216" stroke="#596579" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
<path d="M769 216 L816 216" stroke="#596579" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
<rect x="48" y="350" width="530" height="180" rx="14" fill="white" stroke="#cbd5e1"/><rect x="48" y="350" width="6" height="180" rx="3" fill="#4f46e5"/>
<text x="70" y="384" font-family="Arial,sans-serif" font-size="19" fill="#4f46e5">Before Bob upgrades</text>
<text x="70" y="420" font-family="Arial,sans-serif" font-size="17" fill="#475569">Alice: A + B | Bob: A</text>
<text x="70" y="447" font-family="Arial,sans-serif" font-size="17" fill="#475569">Use A only if local policy permits A.</text>
<text x="70" y="474" font-family="Arial,sans-serif" font-size="17" fill="#475569">If B is required, stop before publication.</text>
<rect x="622" y="350" width="530" height="180" rx="14" fill="white" stroke="#cbd5e1"/><rect x="622" y="350" width="6" height="180" rx="3" fill="#0f766e"/>
<text x="644" y="384" font-family="Arial,sans-serif" font-size="19" fill="#0f766e">After Bob upgrades</text>
<text x="644" y="420" font-family="Arial,sans-serif" font-size="17" fill="#475569">Alice: A + B | Bob: A + B</text>
<text x="644" y="447" font-family="Arial,sans-serif" font-size="17" fill="#475569">Select B and measure the complete event.</text>
<text x="644" y="474" font-family="Arial,sans-serif" font-size="17" fill="#475569">Same relay, if size and admission rules fit.</text>
<path d="M995 304 L995 344" stroke="#596579" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
<text x="48" y="581" font-family="Arial,sans-serif" font-size="20" fill="#18233c">New suite: new endpoint cryptography. Opaque relay: existing container checks.</text>
<text x="48" y="620" font-family="Arial,sans-serif" font-size="17" fill="#475569">No common permitted suite or no authorized compatible route means a visible failure.</text>
</svg>
