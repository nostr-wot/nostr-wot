<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc"><title id="title">From capability discovery to decryption</title><desc id="desc">Sequence between sender, relay and recipient. Encryption happens before publication. Relay acknowledges admission, and recipient independently validates and decrypts.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#596579"/></marker></defs><rect width="1200" height="760" fill="#f5f7fb"/>
<text x="48" y="48" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#18233c">From capability discovery to decryption</text>
<rect x="65" y="92" width="300" height="60" rx="14" fill="white" stroke="#cbd5e1"/><rect x="65" y="92" width="6" height="60" rx="3" fill="#4f46e5"/>
<text x="87" y="126" font-family="Arial,sans-serif" font-size="19" fill="#4f46e5">Sender + signer</text>
<path d="M215 157 V690" stroke="#cbd5e1" stroke-dasharray="6 6"/>
<rect x="450" y="92" width="300" height="60" rx="14" fill="white" stroke="#cbd5e1"/><rect x="450" y="92" width="6" height="60" rx="3" fill="#4f46e5"/>
<text x="472" y="126" font-family="Arial,sans-serif" font-size="19" fill="#4f46e5">Relay</text>
<path d="M600 157 V690" stroke="#cbd5e1" stroke-dasharray="6 6"/>
<rect x="835" y="92" width="300" height="60" rx="14" fill="white" stroke="#cbd5e1"/><rect x="835" y="92" width="6" height="60" rx="3" fill="#4f46e5"/>
<text x="857" y="126" font-family="Arial,sans-serif" font-size="19" fill="#4f46e5">Recipient</text>
<path d="M985 157 V690" stroke="#cbd5e1" stroke-dasharray="6 6"/>
<text x="48" y="192" font-family="Arial,sans-serif" font-size="16" fill="#475569">Authenticated peer capability + local minimum policy</text>
<text x="235" y="244" font-family="Arial,sans-serif" font-size="16" fill="#475569">Read advertised admission limits</text>
<path d="M215 260 L600 260" stroke="#596579" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
<text x="235" y="296" font-family="Arial,sans-serif" font-size="16" fill="#475569">NIP-11 policy (advisory)</text>
<path d="M600 313 L215 313" stroke="#596579" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
<text x="48" y="355" font-family="Arial,sans-serif" font-size="16" fill="#4f46e5">Encrypt seal; wrap; preflight every copy</text>
<text x="235" y="404" font-family="Arial,sans-serif" font-size="16" fill="#475569">EVENT: opaque kind-1059 wrapper</text>
<path d="M215 421 L600 421" stroke="#596579" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
<text x="620" y="458" font-family="Arial,sans-serif" font-size="16" fill="#0f766e">Bound size; validate event + policy</text>
<text x="235" y="499" font-family="Arial,sans-serif" font-size="16" fill="#475569">OK: admitted (or rejection)</text>
<path d="M600 516 L215 516" stroke="#596579" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
<text x="622" y="556" font-family="Arial,sans-serif" font-size="16" fill="#475569">Serve under recipient access rules</text>
<path d="M600 573 L985 573" stroke="#596579" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
<text x="765" y="620" font-family="Arial,sans-serif" font-size="16" fill="#4f46e5">Validate, decrypt, check rumor</text>
<text x="48" y="717" font-family="Arial,sans-serif" font-size="18" fill="#475569">Relay failure never authorizes weaker encryption. Recipient success is a separate outcome.</text>
</svg>
