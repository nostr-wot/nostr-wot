<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="500" viewBox="0 0 1200 500" role="img" aria-labelledby="title desc"><title id="title">Different responsibilities, one event container</title><desc id="desc">The sender encrypts; the relay validates visible structure and policy; the recipient decrypts. The relay has no access to the hidden encryption selector.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#596579"/></marker></defs><rect width="1200" height="500" fill="#f5f7fb"/>
<text x="48" y="48" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#18233c">Different responsibilities, one event container</text>
<text x="48" y="83" font-family="Arial,sans-serif" font-size="17" fill="#475569">Proposed migration architecture | no universal encryption field added to ordinary events</text>
<rect x="48" y="135" width="330" height="225" rx="14" fill="white" stroke="#cbd5e1"/><rect x="48" y="135" width="6" height="225" rx="3" fill="#4f46e5"/>
<text x="70" y="169" font-family="Arial,sans-serif" font-size="19" fill="#4f46e5">Sender + signer</text>
<text x="70" y="205" font-family="Arial,sans-serif" font-size="17" fill="#475569">Resolve recipient keys</text>
<text x="70" y="232" font-family="Arial,sans-serif" font-size="17" fill="#475569">Choose an allowed shared suite</text>
<text x="70" y="259" font-family="Arial,sans-serif" font-size="17" fill="#475569">Encrypt rumor into seal</text>
<text x="70" y="286" font-family="Arial,sans-serif" font-size="17" fill="#475569">Build kind-1059 gift wrap</text>
<rect x="435" y="135" width="330" height="225" rx="14" fill="white" stroke="#cbd5e1"/><rect x="435" y="135" width="6" height="225" rx="3" fill="#0f766e"/>
<text x="457" y="169" font-family="Arial,sans-serif" font-size="19" fill="#0f766e">Relay</text>
<text x="457" y="205" font-family="Arial,sans-serif" font-size="17" fill="#475569">Bound bytes and resource use</text>
<text x="457" y="232" font-family="Arial,sans-serif" font-size="17" fill="#475569">Check event signature + policy</text>
<text x="457" y="259" font-family="Arial,sans-serif" font-size="17" fill="#475569">Verify visible proofs if required</text>
<text x="457" y="286" font-family="Arial,sans-serif" font-size="17" fill="#475569">Store encrypted content</text>
<rect x="822" y="135" width="330" height="225" rx="14" fill="white" stroke="#cbd5e1"/><rect x="822" y="135" width="6" height="225" rx="3" fill="#4f46e5"/>
<text x="844" y="169" font-family="Arial,sans-serif" font-size="19" fill="#4f46e5">Recipient</text>
<text x="844" y="205" font-family="Arial,sans-serif" font-size="17" fill="#475569">Check wrapper and seal</text>
<text x="844" y="232" font-family="Arial,sans-serif" font-size="17" fill="#475569">Recognize supported suite</text>
<text x="844" y="259" font-family="Arial,sans-serif" font-size="17" fill="#475569">Authenticate and decrypt</text>
<text x="844" y="286" font-family="Arial,sans-serif" font-size="17" fill="#475569">Validate application message</text>
<path d="M381 247 L429 247" stroke="#596579" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
<path d="M769 247 L816 247" stroke="#596579" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
<text x="48" y="413" font-family="Arial,sans-serif" font-size="17" fill="#4f46e5">PRIVATE: suite, keys, message</text>
<text x="435" y="413" font-family="Arial,sans-serif" font-size="17" fill="#0f766e">VISIBLE: container + public proofs</text>
<text x="822" y="413" font-family="Arial,sans-serif" font-size="17" fill="#4f46e5">PRIVATE: decryption outcome</text>
<text x="48" y="467" font-family="Arial,sans-serif" font-size="18" fill="#475569">Relay acceptance establishes admission, not successful decryption or message truth.</text>
</svg>
