<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Protected server and rotated access keys</title>
  <desc id="desc">A tactile indigo server sits inside a protective orbit while old access keys move toward a coral quarantine tray and new keys move toward a mint recovery tray.</desc>
