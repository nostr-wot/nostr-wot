name: Deploy to Prod

# Called only after CI has verified this exact main-branch commit. The caller
# holds the repository-wide concurrency lock for verification AND deployment.
on:
  workflow_call:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - uses: actions/download-artifact@v8
        with:
          name: production-${{ github.sha }}

      - name: Write runtime environment
        env:
          PRODUCTION_ENV: ${{ secrets.ENV_PRODUCTION }}
        run: |
          printf '%s\n' "$PRODUCTION_ENV" > .env
          printf '\nNEXT_PUBLIC_BASE_URL=https://nostrwot.com\nSITE_BASE_URL=https://nostrwot.com\n' >> .env

      - name: Upload production files via SCP
        uses: appleboy/scp-action@v0.1.4
        with:
          host: ${{ secrets.SSH_HOST_PROD }}
          username: ${{ secrets.SSH_USER_PROD }}
          key: ${{ secrets.SSH_PRIVATE_KEY_PROD }}
          source: "production.tar.gz,.env,scripts/deploy-site.sh,scripts/site-nginx.mjs"
          target: /var/www/nostr-wot/incoming/${{ github.sha }}
          overwrite: true

      - name: Activate the healthy release via SSH
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.SSH_HOST_PROD }}
          username: ${{ secrets.SSH_USER_PROD }}
          key: ${{ secrets.SSH_PRIVATE_KEY_PROD }}
          command_timeout: 20m
          script: bash /var/www/nostr-wot/incoming/${{ github.sha }}/scripts/deploy-site.sh '${{ github.sha }}'

      - name: Verify the live homepage and refreshed sitemap
        run: |
          curl --fail --retry 12 --retry-delay 5 --retry-all-errors https://nostrwot.com/ -o /dev/null
          curl --fail --retry 6 --retry-delay 5 --retry-all-errors https://nostrwot.com/sitemap.xml -o "$RUNNER_TEMP/live-sitemap.xml"
          python3 -c 'import os, xml.etree.ElementTree as E; r=E.parse(os.environ["RUNNER_TEMP"]+"/live-sitemap.xml"); assert len(r.findall("{*}url")) > 0'

      - name: Restore IndexNow state
        uses: actions/cache/restore@v6
        with:
          path: scripts/.indexnow-cache.json
          key: indexnow-${{ github.sha }}
          restore-keys: indexnow-

      - name: Submit changed URLs and request homepage reindexing
        run: npx --yes --package=tsx tsx scripts/indexnow.ts --homepage

      - name: Save updated IndexNow state
        uses: actions/cache/save@v6
        with:
          path: scripts/.indexnow-cache.json
          key: indexnow-${{ github.sha }}
