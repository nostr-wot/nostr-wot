name: CI

# Only repository documentation and the social delivery ledger are excluded.
# Keep site Markdown, newsletter editions, social copy, tests and config covered.
# No required checks are configured; revisit PR filtering before requiring verify.
on:
  pull_request:
    branches: [main]
    paths-ignore:
      - 'README.md'
      - 'AGENTS.md'
      - 'LICENSE'
      - 'docs/**'
      - 'social/README.md'
      - 'scripts/newsletters/README.md'
      - 'data/social-posted.json'
  push:
    branches: [main]
    paths-ignore:
      - 'README.md'
      - 'AGENTS.md'
      - 'LICENSE'
      - 'docs/**'
      - 'social/README.md'
      - 'scripts/newsletters/README.md'
      - 'data/social-posted.json'

# All workflows share this lock. Never interrupt deployments or message sends.
concurrency:
  group: nostr-wot-actions
  cancel-in-progress: false
  queue: max

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    outputs:
      site: ${{ steps.changes.outputs.site }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check whether website inputs changed
        id: changes
        run: node scripts/ci-site-changed.mjs

      - uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install locked dependencies
        run: npm ci --legacy-peer-deps

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Unit tests
        run: npm test

      - name: Cache generator parity
        run: npm run test:parity

      - name: Social copy lint
        run: npm run social:lint

      - name: Configure production build
        if: github.event_name == 'push' && steps.changes.outputs.site == 'true'
        env:
          PRODUCTION_ENV: ${{ secrets.ENV_PRODUCTION }}
        run: |
          printf '%s\n' "$PRODUCTION_ENV" > .env
          printf '\nNEXT_PUBLIC_BASE_URL=https://nostrwot.com\nSITE_BASE_URL=https://nostrwot.com\n' >> .env

      - name: Build
        if: steps.changes.outputs.site == 'true'
        run: npm run build

      - name: Audit rendered sitemap, metadata, JSON-LD and preview images
        if: steps.changes.outputs.site == 'true'
        run: |
          npm run start -- --port 3100 > "$RUNNER_TEMP/seo-server.log" 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://localhost:3100/sitemap.xml > /dev/null; then break; fi
            sleep 1
          done
          npm run audit:seo -- --origin http://localhost:3100 --output "$RUNNER_TEMP/seo-audit.json"

      - name: Package the verified production build
        if: github.event_name == 'push' && steps.changes.outputs.site == 'true'
        run: |
          tar --exclude='.next/cache' -czf "$RUNNER_TEMP/production.tar.gz" .next public scripts/newsletters newsletters next.config.ts package.json package-lock.json

      - uses: actions/upload-artifact@v7
        if: github.event_name == 'push' && steps.changes.outputs.site == 'true'
        with:
          name: production-${{ github.sha }}
          path: ${{ runner.temp }}/production.tar.gz
          retention-days: 1
          compression-level: 0

  deploy:
    needs: verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.verify.outputs.site == 'true'
    uses: ./.github/workflows/deploy.yml
    secrets: inherit
