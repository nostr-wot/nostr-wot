name: CI

# Only repository documentation and the social delivery ledger are excluded.
# Keep site Markdown, newsletter editions, social copy, tests and config covered.
# No required checks are configured; revisit PR filtering before requiring verify.
on:
  pull_request:
    branches: [main]
    paths-ignore:
      - 'README.md'
      - 'AGENTS.md'
      - 'LICENSE'
      - 'docs/**'
      - 'social/README.md'
      - 'scripts/newsletters/README.md'
      - 'data/social-posted.json'
  push:
    branches: [main]
    paths-ignore:
      - 'README.md'
      - 'AGENTS.md'
      - 'LICENSE'
      - 'docs/**'
      - 'social/README.md'
      - 'scripts/newsletters/README.md'
      - 'data/social-posted.json'

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Unit tests
        run: npm test

      - name: Cache generator parity (fixture golden)
        run: npm run test:parity

      # The last check between drafted social copy and a post that goes out
      # under the project's name: .github/workflows/social.yml has no reviewer.
      # This also runs on push to main, which is the only coverage the newsroom
      # path gets, since that agent commits without a pull request.
      # See docs/social-posting.md section 6.
      - name: Social copy lint
        run: npm run social:lint

      - name: Build
        run: npm run build
