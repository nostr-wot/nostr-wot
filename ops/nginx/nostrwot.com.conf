# Canonical website: preserve paths and query strings for every legacy URL.
server {
    listen 80;
    listen [::]:80;
    server_name nostr-wot.com www.nostr-wot.com nostrwot.com www.nostrwot.com;
    return 301 https://nostrwot.com$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name nostr-wot.com www.nostr-wot.com www.nostrwot.com;
    ssl_certificate /etc/letsencrypt/live/nostr-wot.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/nostr-wot.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    # Already-sent mail contains one-click POST URLs on the old domain.
    # A 301 can turn POST into GET, so process these without a redirect.
    location = /api/newsletter/unsubscribe {
        if ($request_method != POST) {
            return 301 https://nostrwot.com$request_uri;
        }
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host nostrwot.com;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
    location / {
        return 301 https://nostrwot.com$request_uri;
    }
}

# =========================
# main https server
# =========================
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name nostrwot.com;

    # tls
    ssl_certificate /etc/letsencrypt/live/nostr-wot.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/nostr-wot.com/privkey.pem; # managed by Certbot
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:50m;
    ssl_session_tickets off;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # hsts (only header Nginx should add — Next.js doesn't set this)
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

    # all other security headers (CSP, X-Frame-Options, etc.) are set by Next.js
    # do NOT duplicate them here — duplicate headers confuse social crawlers

    # hide nginx info
    server_tokens off;

    # request limits
    client_max_body_size 10m;
    client_body_timeout 10s;
    client_header_timeout 10s;
    keepalive_timeout 20s;

    # block common junk
    location ~* /\.(env|git|svn|hg) {
        deny all;
    }

    location ~* /(wp-admin|wp-login|xmlrpc|phpmyadmin) {
        return 444;
    }

    # =========================
    # /widgets (marketing page) — Next.js, NOT the widget service.
    # Must come before the ^~ /widgets/ block so requests for the bare path
    # land on Next instead of being 301'd into the widget service (which 404s).
    # =========================
    location = /widgets {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    location = /widgets/ {
        return 301 https://nostrwot.com/widgets$is_args$args;
    }

    # =========================
    # nostr-widgets (Hono on :3004)
    # ^~ wins over regex matches so .svg requests under /widgets/ go here, not the static-asset block
    # =========================
    location ^~ /widgets/ {
        proxy_pass         http://127.0.0.1:3004;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_pass_request_headers on;
        proxy_buffering            off;
        proxy_connect_timeout 3s;
        proxy_read_timeout    5s;
        proxy_send_timeout    5s;
    }

    # =========================
    # static assets — serve directly with long cache
    # =========================
    location ~* \.(jpg|jpeg|png|gif|ico|svg|webp|woff|woff2|ttf|css|js)$ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;

        proxy_cache_valid 200 4h;
        expires 4h;
        add_header Cache-Control "public, max-age=14400";
    }

    # =========================
    # nextjs reverse proxy
    # =========================
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;

        # websocket support (nextjs uses this)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }


}
